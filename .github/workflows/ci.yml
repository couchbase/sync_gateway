name: ci
permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'release/*'
      - 'feature/*'
      - 'beryllium'
      - 'CBG*'
      - 'ci-*'
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'release/*'
      - 'beryllium'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'release/') && !contains(github.ref, 'main') }}

env:
  # Pinned action versions, referenced by the steps below through their YAML anchors.
  ACTIONS_CHECKOUT_VERSION: &actions_checkout_version actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  ACTIONS_SETUP_GO_VERSION: &actions_setup_go_version actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
  ACTIONS_UPLOAD_ARTIFACT_VERSION: &actions_upload_artifact_version actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
  ACTIONS_RUFF_VERSION: &actions_ruff_version astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
  ACTIONS_SETUP_UV_VERSION: &actions_setup_uv_version astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
  ACTIONS_GOLANGCI_LINT_VERSION: &actions_golangci_lint_version golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
  # tag for repo at v1 is not updated
  ACTIONS_GOVULNCHECK_VERSION: &actions_govulncheck_version golang/govulncheck-action@31f7c5463448f83528bd771c2d978d940080c9fd
  ACTIONS_GO_TEST_ANNOTATIONS_VERSION: &actions_go_test_annotations_version guyarb/golang-test-annotations@96fc379b171c49932041d6c789e73331a7bdeec1 # v0.9.0
  GO_MOD_FILE: &go_mod_file go.mod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - name: go-build
        run: go build "./..."

  addlicense:
    name: addlicense
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - run: go tool addlicense -check -f licenses/addlicense.tmpl .

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - name: golangci-lint
        uses: *actions_golangci_lint_version
        with:
          version: v2.13.1
          args: --config=.golangci-strict.yml

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: ubuntu
    env:
      GOPRIVATE: github.com/couchbaselabs
      MallocNanoZone: 0
    name: test (${{ matrix.name }})
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - name: Build
        run: go build -v "./..."
      - name: Run Tests
        run: go tool gotestsum --format pkgname-and-test-fails --hide-summary=skipped --hide-summary=output --jsonfile test.json -- -tags cb_sg_devmode -shuffle=on -timeout=30m -count=1 "./..."
        shell: bash
      - name: Test Summary
        if: always()
        shell: bash
        run: .github/scripts/test-summary.sh
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json
      - name: Render test log
        if: failure()
        shell: bash
        run: go tool gotestsum --format standard-verbose --raw-command -- cat test.json > test.log 2>&1 || true
      - name: Upload test logs artifact
        if: failure()
        uses: *actions_upload_artifact_version
        with:
          name: test-logs-${{ github.job }}-${{ matrix.name || matrix.os || 'default' }}
          path: test.log
          retention-days: 7
          if-no-files-found: warn

  test-race:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/couchbaselabs
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - name: Run Tests
        run: go tool gotestsum --format pkgname-and-test-fails --hide-summary=skipped --hide-summary=output --jsonfile test.json -- -tags cb_sg_devmode -race -shuffle=on -timeout=30m -count=1 "./..."
        shell: bash
      - name: Test Summary
        if: always()
        shell: bash
        run: .github/scripts/test-summary.sh
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json
      - name: Render test log
        if: failure()
        shell: bash
        run: go tool gotestsum --format standard-verbose --raw-command -- cat test.json > test.log 2>&1 || true
      - name: Upload test logs artifact
        if: failure()
        uses: *actions_upload_artifact_version
        with:
          name: test-logs-${{ github.job }}
          path: test.log
          retention-days: 7
          if-no-files-found: warn

  test-default-collection:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/couchbaselabs
      SG_TEST_USE_DEFAULT_COLLECTION: true
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - name: Run Tests
        run: go tool gotestsum --format pkgname-and-test-fails --hide-summary=skipped --hide-summary=output --jsonfile test.json -- -tags cb_sg_devmode -shuffle=on -timeout=30m -count=1 "./..."
        shell: bash
      - name: Test Summary
        if: always()
        shell: bash
        run: .github/scripts/test-summary.sh
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json
      - name: Render test log
        if: failure()
        shell: bash
        run: go tool gotestsum --format standard-verbose --raw-command -- cat test.json > test.log 2>&1 || true
      - name: Upload test logs artifact
        if: failure()
        uses: *actions_upload_artifact_version
        with:
          name: test-logs-${{ github.job }}
          path: test.log
          retention-days: 7
          if-no-files-found: warn
  test-benchmark-compile:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/couchbaselabs
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - name: Run Tests
        run: go tool gotestsum --format pkgname-and-test-fails --hide-summary=skipped --hide-summary=output --jsonfile test.json -- -tags cb_sg_devmode -shuffle=on -timeout=30m -count=1 -short -bench=. -benchtime=1x -run '!' "./..."
        shell: bash
      - name: Test Summary
        if: always()
        shell: bash
        run: .github/scripts/test-summary.sh
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json
      - name: Render test log
        if: failure()
        shell: bash
        run: go tool gotestsum --format standard-verbose --raw-command -- cat test.json > test.log 2>&1 || true
      - name: Upload test logs artifact
        if: failure()
        uses: *actions_upload_artifact_version
        with:
          name: test-logs-${{ github.job }}
          path: test.log
          retention-days: 7
          if-no-files-found: warn


  test-disable-rev-cache:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/couchbaselabs
      SG_TEST_DISABLE_REV_CACHE: true
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - name: Run Tests
        run: go tool gotestsum --format pkgname-and-test-fails --hide-summary=skipped --hide-summary=output --jsonfile test.json -- -tags cb_sg_devmode -shuffle=on -timeout=30m -count=1 "./..."
        shell: bash
      - name: Test Summary
        if: always()
        shell: bash
        run: .github/scripts/test-summary.sh
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json
      - name: Render test log
        if: failure()
        shell: bash
        run: go tool gotestsum --format standard-verbose --raw-command -- cat test.json > test.log 2>&1 || true
      - name: Upload test logs artifact
        if: failure()
        uses: *actions_upload_artifact_version
        with:
          name: test-logs-${{ github.job }}
          path: test.log
          retention-days: 7
          if-no-files-found: warn

  python-format:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_ruff_version
        with:
          args: 'format --check'
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_ruff_version
  test-sgcollect:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_uv_version
      - name: Run test
        run: |
          uv run -- pytest
      - name: Run ty
        run: |
          uv run -- ty check

  test-stats-definition-exporter:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - name: Build
        run: go build -v "./tools/stats-definition-exporter"
      - name: Run Tests
        run: go tool gotestsum --format pkgname-and-test-fails --hide-summary=skipped --hide-summary=output --jsonfile test.json -- -shuffle=on -timeout=5m -count=1 "./tools/stats-definition-exporter"
        shell: bash
      - name: Test Summary
        if: always()
        shell: bash
        run: .github/scripts/test-summary.sh
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json
      - name: Render test log
        if: failure()
        shell: bash
        run: go tool gotestsum --format standard-verbose --raw-command -- cat test.json > test.log 2>&1 || true
      - name: Upload test logs artifact
        if: failure()
        uses: *actions_upload_artifact_version
        with:
          name: test-logs-${{ github.job }}-${{ matrix.name || matrix.os || 'default' }}
          path: test.log
          retention-days: 7
          if-no-files-found: warn
  cache_perf_tool_build:
    runs-on: ubuntu-latest
    name: build cache perf tool
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version-file: *go_mod_file
      - name: Build
        run: go build "./tools/cache_perf_tool"
  govulncheck:
    runs-on: ubuntu-latest
    name: Run govulncheck
    steps:
      - id: govulncheck
        uses: *actions_govulncheck_version
        with:
          # blank this or the action's 'stable' default overrides the file
          go-version-input: ''
          go-version-file: *go_mod_file
          go-package: ./...
