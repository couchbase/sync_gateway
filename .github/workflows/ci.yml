name: ci

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'release/*'
      - 'feature/*'
      - 'beryllium'
      - 'CBG*'
      - 'ci-*'
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'release/*'
      - 'beryllium'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'release/') && !contains(github.ref, 'main') }}

env:
  # Pinned action versions, referenced by the steps below through their YAML anchors.
  ACTIONS_CHECKOUT_VERSION: &actions_checkout_version actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  ACTIONS_CHECKOUT_V5_VERSION: &actions_checkout_v5_version actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
  ACTIONS_SETUP_GO_VERSION: &actions_setup_go_version actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
  ACTIONS_GOLANGCI_LINT_VERSION: &actions_golangci_lint_version golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
  ACTIONS_GO_TEST_ANNOTATIONS_VERSION: &actions_go_test_annotations_version guyarb/golang-test-annotations@2941118d7ef622b1b3771d1ff6eae9e90659eb26 # v0.8.0
  ACTIONS_RUFF_VERSION: &actions_ruff_version astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
  ACTIONS_SETUP_UV_VERSION: &actions_setup_uv_version astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.24.4
      - name: go-build
        run: go build "./..."

  addlicense:
    name: addlicense
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.24.4
      - run: go install github.com/google/addlicense@latest
      - run: addlicense -check -f licenses/addlicense.tmpl .

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.24.4
      - name: golangci-lint
        uses: *actions_golangci_lint_version
        with:
          version: v2.0.2
          args: --config=.golangci-strict.yml

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: ubuntu
    env:
      GOPRIVATE: github.com/couchbaselabs
      MallocNanoZone: 0
    name: test (${{ matrix.name }})
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.24.4
      - name: Build
        run: go build -v "./..."
      - name: Run Tests
        run: go test -tags cb_sg_devmode -shuffle=on -timeout=30m -count=1 -json -v "./..." | tee test.json | jq -s -jr 'sort_by(.Package,.Time) | .[].Output | select (. != null )'
        shell: bash
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json

  test-race:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/couchbaselabs
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.24.4
      - name: Run Tests
        run: go test -tags cb_sg_devmode -race -shuffle=on -timeout=30m -count=1 -json -v "./..." | tee test.json | jq -s -jr 'sort_by(.Package,.Time) | .[].Output | select (. != null )'
        shell: bash
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json

  test-default-collection:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/couchbaselabs
      SG_TEST_USE_DEFAULT_COLLECTION: true
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.24.4
      - name: Run Tests
        run: go test -tags cb_sg_devmode -shuffle=on -timeout=30m -count=1 -json -v "./..." | tee test.json | jq -s -jr 'sort_by(.Package,.Time) | .[].Output | select (. != null )'
        shell: bash
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json

  test-no-xattrs:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/couchbaselabs
      SG_TEST_USE_XATTRS: false
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.24.4
      - name: Run Tests
        run: go test -tags cb_sg_devmode -shuffle=on -timeout=30m -count=1 -json -v "./..." | tee test.json | jq -s -jr 'sort_by(.Package,.Time) | .[].Output | select (. != null )'
        shell: bash
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json

  python-format:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_ruff_version
        with:
          args: 'format --check'
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_ruff_version
  test-sgcollect:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: *actions_checkout_v5_version
      - uses: *actions_setup_uv_version
      - name: Run test
        run: |
          uv run -- pytest
      - name: Run mypy
        run: |
          uv run -- mypy

  test-stats-definition-exporter:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.24.4
      - name: Build
        run: go build -v "./tools/stats-definition-exporter"
      - name: Run Tests
        run: go test -shuffle=on -timeout=5m -count=1 -json -v "./tools/stats-definition-exporter" | tee test.json | jq -s -jr 'sort_by(.Package,.Time) | .[].Output | select (. != null )'
        shell: bash
  cache_perf_tool_build:
    runs-on: ubuntu-latest
    name: build cache perf tool
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.24.4
      - name: Build
        run: go build "./tools/cache_perf_tool"
