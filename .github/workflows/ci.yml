name: ci
permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'release/*'
      - 'feature/*'
      - 'beryllium'
      - 'CBG*'
      - 'ci-*'
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'release/*'
      - 'beryllium'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'release/') && !contains(github.ref, 'main') }}

env:
  # Pinned action versions, referenced by the steps below through their YAML anchors.
  ACTIONS_CHECKOUT_VERSION: &actions_checkout_version actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  ACTIONS_SETUP_GO_VERSION: &actions_setup_go_version actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
  ACTIONS_RUFF_VERSION: &actions_ruff_version astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
  ACTIONS_SETUP_UV_VERSION: &actions_setup_uv_version astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
  # held at v7: v8+ needs golangci-lint v2.1.0 or newer, and this branch runs v2.0.2
  ACTIONS_GOLANGCI_LINT_VERSION: &actions_golangci_lint_version golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
  ACTIONS_GO_TEST_ANNOTATIONS_VERSION: &actions_go_test_annotations_version guyarb/golang-test-annotations@96fc379b171c49932041d6c789e73331a7bdeec1 # v0.9.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.25.13
      - name: go-build
        run: go build "./..."

  addlicense:
    name: addlicense
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.25.13
      - run: go install github.com/google/addlicense@latest
      - run: addlicense -check -f licenses/addlicense.tmpl .

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.25.13
      - name: golangci-lint
        uses: *actions_golangci_lint_version
        with:
          version: v2.0.2
          args: --config=.golangci-strict.yml

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: ubuntu
    env:
      GOPRIVATE: github.com/couchbaselabs
      MallocNanoZone: 0
    name: test (${{ matrix.name }})
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.25.13
      - name: Build
        run: go build -v "./..."
      - name: Run Tests
        run: go test -tags cb_sg_devmode -shuffle=on -timeout=30m -count=1 -json -v "./..." | tee test.json | jq -s -jr 'sort_by(.Package,.Time) | .[].Output | select (. != null )'
        shell: bash
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json

  test-race:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/couchbaselabs
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.25.13
      - name: Run Tests
        run: go test -tags cb_sg_devmode -race -shuffle=on -timeout=30m -count=1 -json -v "./..." | tee test.json | jq -s -jr 'sort_by(.Package,.Time) | .[].Output | select (. != null )'
        shell: bash
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json

  test-default-collection:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/couchbaselabs
      SG_TEST_USE_DEFAULT_COLLECTION: true
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.25.13
      - name: Run Tests
        run: go test -tags cb_sg_devmode -shuffle=on -timeout=30m -count=1 -json -v "./..." | tee test.json | jq -s -jr 'sort_by(.Package,.Time) | .[].Output | select (. != null )'
        shell: bash
      - name: Annotate Failures
        if: always()
        uses: *actions_go_test_annotations_version
        with:
          test-results: test.json

  python-format:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_ruff_version
        with:
          args: 'format --check'
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_ruff_version
  test-sgcollect:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_uv_version
      - name: Run test
        run: |
          uv run -- pytest
      - name: Run mypy
        run: |
          uv run -- mypy

  test-stats-definition-exporter:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.25.13
      - name: Build
        run: go build -v "./tools/stats-definition-exporter"
      - name: Run Tests
        run: go test -shuffle=on -timeout=5m -count=1 -json -v "./tools/stats-definition-exporter" | tee test.json | jq -s -jr 'sort_by(.Package,.Time) | .[].Output | select (. != null )'
        shell: bash
  cache_perf_tool_build:
    runs-on: ubuntu-latest
    name: build cache perf tool
    steps:
      - uses: *actions_checkout_version
      - uses: *actions_setup_go_version
        with:
          go-version: 1.25.13
      - name: Build
        run: go build "./tools/cache_perf_tool"
