repos:
  - repo: local
    hooks:
      - id: addlicense
        name: addlicense
        language: system
        entry: go run github.com/google/addlicense@latest -f licenses/addlicense.tmpl
        types_or: [go, python]

      - id: goimports
        name: goimports
        language: system
        entry: go run golang.org/x/tools/cmd/goimports@latest
        args: [-w]
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        language: system
        # version must match .github/workflows/ci.yml golangci job
        # Cache per checkout: a shared cache serves results from other clones of this module,
        # which report findings against that clone's file paths.
        entry: sh -c 'export GOLANGCI_LINT_CACHE="$(git rev-parse --absolute-git-dir)/golangci-lint-cache";
               exec go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
               run --config=.golangci-strict.yml --fix=false'
        types: [go]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run -- ruff format
        types: [python]

      - id: ty
        name: ty
        language: system
        entry: uv run -- ty check
        types: [python]
        # ty checks the whole project via [tool.ty.src] in pyproject.toml
        pass_filenames: false

      - id: manifest-product-config-sorted
        name: manifest/product-config.json keys sorted
        language: system
        entry: bash -c 'diff <(jq --sort-keys . manifest/product-config.json) <(jq . manifest/product-config.json)'
        files: ^manifest/product-config\.json$
        pass_filenames: false

      - id: redocly-lint
        name: redocly lint
        language: system
        # npm ci installs from the lockfile, so no manual setup step and no
        # stale node_modules after a version bump
        entry: >-
          bash -c 'npm ci --no-audit --no-fund --silent &&
          ./node_modules/.bin/redocly lint --config=.redocly.yaml --format=stylish'
        files: ^(docs/api/|\.redocly\.yaml$)
        pass_filenames: false

      - id: yamllint
        name: yamllint
        language: system
        entry: yamllint
        args: [docs/api]
        files: ^docs/api/
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        types: [shell]
        exclude: >-
          (?x)^(
            build\.sh|
            bootstrap\.sh|
            bench\.sh|
            build/postinst\.tmpl|
            build/postrm\.tmpl|
            integration-test/service-test\.sh|
            integration-test/service-install-tests\.sh|
            rewrite-manifest\.sh|
            snap-manifest\.sh|
            set-version-stamp\.sh|
            service/sync_gateway_service_install\.sh|
            service/sync_gateway_service_uninstall\.sh|
            service/sync_gateway_service_upgrade\.sh|
            test-integration-init\.sh|
            test\.sh
          )$
